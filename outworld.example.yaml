listen: 127.0.0.1:8787

vault:
  path: ./outworld.vault
  key_env: OUTWORLD_VAULT_KEY
  # key_file: ./outworld.key

upstreams:
  cloud:
    base_url: https://api.example.com/v1
    api_key_env: CLOUD_API_KEY
  local:
    base_url: http://127.0.0.1:11434/v1
    # model: llama3.1:8b
  # tee:
  #   base_url: https://confidential.example.net/v1
  #   api_key_env: TEE_API_KEY
  # claude:
  #   api: anthropic
  #   base_url: https://api.anthropic.com/v1
  #   api_key_env: ANTHROPIC_API_KEY
  #   # forward_auth: true

policy:
  default_route: masked
  masked_upstream: cloud
  local_upstream: local
  # passthrough_upstream: tee
  # anthropic:
  #   masked_upstream: claude
  # allow: ["Grace Hopper"]
  date_shift: true
  date_shift_scope: global
  date_order: mdy
  dictionary: ./people.csv
  # allow_route_header unset: X-Outworld-Route may only make routing stricter (block > local > masked > passthrough).
  # true lets clients pick any route (local, passthrough:<name>); false ignores the header.
  # allow_route_header: true
  allow_scope_header: false
  allow_images: false
  # Base64 values of 1 KiB or more that decode to gzip, zlib, bzip2, zip or tar data are inflated and
  # scanned; xz, zstd, 7z and lzma data cannot be read and is refused. A blob that inflates past
  # max_inflated_bytes, or a request (or CLI input) whose inflated blobs together pass
  # max_inflated_request_bytes, is not forwarded: 422 at the gateway, stripped by the CLI.
  # Scanning costs roughly 8 to 15 microseconds per inflated byte, so raise these with care.
  # max_inflated_bytes: 1048576
  # max_inflated_request_bytes: 2097152
  entities:
    person: mask
    email: mask
    phone: mask
    address: mask
    date: shift
    org: keep
    location: keep
    url: keep
    ip: mask
    secret: strip
    gov_id: strip
    financial: strip
  rules:
    - {name: health-and-legal, match_any: ["diagnosis", "lawsuit"], route: local}
    # - {name: no-cards, entities: ["financial"], route: block}
    # - {name: confidential, match_regex: ["(?i)attorney[- ]client"], route: passthrough, upstream: tee}

# ner:
#   url: http://127.0.0.1:8790
#   timeout: 10s
#   threshold: 0.5
#   optional: false

auth:
  token_env: OUTWORLD_TOKEN

log:
  level: info
  format: json

# Opaque values (thinking signatures, redacted_thinking data, encrypted_content) whose base64 text
# is longer than this are refused with 422 without being scanned. Default 786432 (768 KiB).
# max_opaque_bytes: 786432
